name: Bug
description: Something is broken.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduce
      description: Commands, config, seed and commit.
      render: shell
    validations:
      required: true
