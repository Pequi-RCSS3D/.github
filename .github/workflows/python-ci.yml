name: Python CI

on:
  workflow_call:
    inputs:
      sync-args:
        description: Extra arguments for uv sync, e.g. "--extra cpu".
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked ${{ inputs.sync-args }}
      - name: Hooks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - name: Tests
        run: uv run --locked pytest
